<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESSENCE — Парфюмерия</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0c0b09;
            --bg-soft: #14120f;
            --card: #1a1815;
            --text: #f2ede4;
            --muted: #8a8478;
            --gold: #c9a961;
            --gold-light: #e8d5a0;
            --gold-dark: #8a7340;
            --border: rgba(201,169,97,0.15);
            --border-soft: rgba(255,255,255,0.06);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding-bottom: 90px;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Лёгкая зернистость фона */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image: radial-gradient(circle at 20% 30%, rgba(201,169,97,0.03) 0%, transparent 40%),
                              radial-gradient(circle at 80% 70%, rgba(201,169,97,0.04) 0%, transparent 40%);
            pointer-events: none;
            z-index: 1;
        }

        /* ============================================
           АНИМАЦИИ
           ============================================ */
        @keyframes revealUp {
            from { opacity: 0; transform: translateY(30px); filter: blur(6px); }
            to   { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        @keyframes revealFade {
            from { opacity: 0; filter: blur(10px); }
            to   { opacity: 1; filter: blur(0); }
        }
        @keyframes shimmerGold {
            0%   { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(201,169,97,0.4); }
            50%      { box-shadow: 0 0 24px 4px rgba(201,169,97,0.15); }
        }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-8px); }
        }
        @keyframes lineGrow {
            from { transform: scaleX(0); }
            to   { transform: scaleX(1); }
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to   { transform: translateY(0); opacity: 1; }
        }
        @keyframes badgePop {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.4); }
            100% { transform: scale(1); }
        }
        @keyframes rotateSlow {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50%      { opacity: 1; transform: scale(1); }
        }

        /* ============================================
           ШАПКА
           ============================================ */
        .header {
            position: sticky; top: 0; z-index: 50;
            background: rgba(12,11,9,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-soft);
            padding: 18px 20px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 22px;
            font-weight: 500;
            letter-spacing: 8px;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--gold-dark) 0%, var(--gold-light) 50%, var(--gold-dark) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmerGold 5s linear infinite;
            padding-left: 8px;
        }
        .header-icons { display: flex; gap: 18px; align-items: center; }
        .header-icons svg {
            width: 22px; height: 22px;
            stroke: var(--gold); fill: none;
            stroke-width: 1.2;
            transition: transform 0.3s ease;
        }
        .cart-icon-wrap { position: relative; cursor: pointer; }
        .cart-icon-wrap:active svg { transform: scale(0.88); }
        .cart-badge {
            position: absolute; top: -6px; right: -8px;
            background: var(--gold);
            color: #0c0b09;
            font-family: 'Inter', sans-serif;
            font-size: 9px; font-weight: 700;
            min-width: 16px; height: 16px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            padding: 0 4px;
            letter-spacing: 0;
        }
        .cart-badge.pop { animation: badgePop 0.5s cubic-bezier(0.2, 1.4, 0.5, 1); }

        /* ============================================
           БАННЕР
           ============================================ */
        .hero {
            position: relative;
            margin-bottom: 44px;
            overflow: hidden;
        }
        .hero img {
            width: 100%; height: 480px;
            object-fit: cover; display: block;
            filter: brightness(0.55) saturate(0.9);
            transform: scale(1.1);
            transition: transform 0.4s ease-out;
            will-change: transform;
        }
        .hero-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to bottom, rgba(12,11,9,0.3) 0%, rgba(12,11,9,0.85) 75%, var(--bg) 100%);
            display: flex; align-items: center; justify-content: center;
            flex-direction: column;
            padding: 0 24px;
            text-align: center;
        }
        .hero-eyebrow {
            font-size: 10px;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 20px;
            opacity: 0;
            animation: revealFade 1s ease 0.2s forwards;
            position: relative;
            padding: 0 32px;
        }
        .hero-eyebrow::before,
        .hero-eyebrow::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 20px; height: 1px;
            background: var(--gold);
            transform-origin: center;
            animation: lineGrow 1s ease 0.8s both;
        }
        .hero-eyebrow::before { left: 0; }
        .hero-eyebrow::after { right: 0; transform-origin: right; }

        .hero-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 58px;
            font-weight: 400;
            letter-spacing: 12px;
            text-transform: uppercase;
            color: var(--text);
            margin-bottom: 16px;
            padding-left: 12px;
            opacity: 0;
            animation: revealUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 0.4s forwards;
            text-shadow: 0 4px 30px rgba(201,169,97,0.2);
        }
        .hero-tagline {
            font-family: 'Cormorant Garamond', serif;
            font-size: 16px;
            font-style: italic;
            font-weight: 300;
            letter-spacing: 1px;
            color: var(--muted);
            margin-bottom: 36px;
            opacity: 0;
            animation: revealUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 0.7s forwards;
        }
        .hero-btn {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 16px 44px;
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            opacity: 0;
            animation: revealUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 1s forwards;
        }
        .hero-btn::before {
            content: '';
            position: absolute; inset: 0;
            background: var(--gold);
            transform: translateY(101%);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: -1;
        }
        .hero-btn:hover { color: var(--bg); }
        .hero-btn:hover::before { transform: translateY(0); }
        .hero-btn:active { transform: scale(0.97); }

        /* ============================================
           СЕКЦИИ
           ============================================ */
        .section {
            margin-bottom: 52px;
            position: relative;
            z-index: 2;
        }
        .section-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 20px;
            margin-bottom: 22px;
        }
        .section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            font-weight: 500;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text);
            white-space: nowrap;
        }
        .section-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--border) 0%, transparent 100%);
        }
        .section-num {
            font-family: 'Cormorant Garamond', serif;
            font-size: 13px;
            color: var(--gold);
            font-style: italic;
            letter-spacing: 1px;
        }

        /* ============================================
           КАРУСЕЛЬ НОВИНОК
           ============================================ */
        .carousel {
            display: flex; gap: 16px; overflow-x: auto;
            padding: 4px 20px 12px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }
        .carousel::-webkit-scrollbar { display: none; }
        .carousel .card { flex: 0 0 60%; scroll-snap-align: start; }

        /* ============================================
           СЕТКА ТОВАРОВ
           ============================================ */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px 14px;
            padding: 0 20px;
        }

        /* ============================================
           КАРТОЧКА ТОВАРА
           ============================================ */
        .card {
            cursor: pointer;
            animation: revealUp 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }
        .grid .card:nth-child(1) { animation-delay: 0.05s; }
        .grid .card:nth-child(2) { animation-delay: 0.12s; }
        .grid .card:nth-child(3) { animation-delay: 0.19s; }
        .grid .card:nth-child(4) { animation-delay: 0.26s; }
        .grid .card:nth-child(5) { animation-delay: 0.33s; }
        .grid .card:nth-child(6) { animation-delay: 0.4s; }
        .carousel .card:nth-child(1) { animation-delay: 0.1s; }
        .carousel .card:nth-child(2) { animation-delay: 0.2s; }
        .carousel .card:nth-child(3) { animation-delay: 0.3s; }
        .carousel .card:nth-child(4) { animation-delay: 0.4s; }

        .card-img-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;
            background: linear-gradient(135deg, #1a1815 0%, #221f1a 100%);
            overflow: hidden;
            border: 1px solid var(--border-soft);
        }
        .card-img-wrap::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.4) 0%, transparent 50%);
            pointer-events: none;
            z-index: 2;
        }
        .card img {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
            transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            filter: brightness(0.92) contrast(1.05);
        }
        .card:hover img {
            transform: scale(1.08);
            filter: brightness(1) contrast(1.05);
        }
        .card-info {
            padding: 14px 4px 0;
            text-align: center;
        }
        .card h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 17px;
            font-weight: 500;
            line-height: 1.3;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            color: var(--text);
        }
        .card .price {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 500;
            color: var(--gold);
            letter-spacing: 2px;
        }
        .card .price-eur {
            font-size: 10px;
            color: var(--muted);
            margin-top: 3px;
            letter-spacing: 1px;
        }
        .card-add {
            position: absolute;
            bottom: 12px; right: 12px;
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 1px solid var(--gold);
            background: rgba(12,11,9,0.7);
            backdrop-filter: blur(10px);
            color: var(--gold);
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            z-index: 3;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .card-add:hover {
            background: var(--gold);
            color: var(--bg);
            transform: scale(1.08);
        }
        .card-add:active {
            transform: scale(0.92);
        }

        /* ============================================
           КНОПКА "ПОКАЗАТЬ ВСЕ"
           ============================================ */
        .view-all-wrap {
            text-align: center;
            margin-top: 36px;
            padding: 0 20px;
        }
        .view-all {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 16px 44px;
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .view-all::before {
            content: '';
            position: absolute; inset: 0;
            background: var(--gold);
            transform: translateY(101%);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: -1;
        }
        .view-all:hover { color: var(--bg); border-color: var(--gold); }
        .view-all:hover::before { transform: translateY(0); }
        .view-all:active { transform: scale(0.97); }

        /* ============================================
           КАТЕГОРИИ
           ============================================ */
        .categories {
            display: flex; gap: 10px; overflow-x: auto;
            padding: 0 20px 4px;
            -webkit-overflow-scrolling: touch;
        }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn {
            flex-shrink: 0;
            padding: 10px 20px;
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            border: 1px solid var(--border);
            border-radius: 0;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .cat-btn:hover {
            color: var(--gold);
            border-color: var(--gold-dark);
        }
        .cat-btn.active {
            color: var(--bg);
            background: var(--gold);
            border-color: var(--gold);
            animation: glowPulse 3s ease-in-out infinite;
        }

        /* ============================================
           НИЖНЯЯ ПАНЕЛЬ
           ============================================ */
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(12,11,9,0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            color: var(--text);
            padding: 16px 20px;
            display: flex; align-items: center; justify-content: space-between;
            z-index: 60;
        }
        .bottom-bar .info {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
        }
        .bottom-bar .info b {
            color: var(--gold);
            font-weight: 600;
        }
        .bottom-bar .btn {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 12px 26px;
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .bottom-bar .btn:active {
            background: var(--gold);
            color: var(--bg);
            transform: scale(0.96);
        }

        /* ============================================
           МОДАЛКИ
           ============================================ */
        .modal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: flex-end;
            z-index: 100;
        }
        .modal.open {
            display: flex;
            animation: revealFade 0.3s ease;
        }
        .modal-content {
            background: var(--bg-soft);
            color: var(--text);
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            border-top: 1px solid var(--gold);
            padding: 26px 22px 32px;
            animation: slideUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
        }
        .modal-content::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 40px; height: 2px;
            background: var(--gold);
        }
        .modal-content h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 22px;
            font-weight: 500;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--text);
            margin-bottom: 24px;
            text-align: center;
        }
        .cart-item {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-soft);
        }
        .cart-item img {
            width: 60px; height: 76px;
            object-fit: cover;
            background: #1a1815;
            border: 1px solid var(--bord
